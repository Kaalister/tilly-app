name: Release Android via VPS

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  checks: write

jobs:
  android-vps:
    name: Build Android sur VPS
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extraire la version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Creer le check run (en cours)
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const check = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: `tilly-build-android/${process.env.VERSION}`,
              head_sha: context.sha,
              status: 'in_progress',
              started_at: new Date().toISOString(),
            });
            core.setOutput('check_id', check.data.id);
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Declencher le build sur le VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          script: |
            set -e
            /opt/build-releases.sh \
              "https://github.com/${{ github.repository }}.git" \
              "${{ github.ref_name }}" \
              "${{ steps.version.outputs.version }}"

      - name: Marquer le check run - succes
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: ${{ steps.check.outputs.check_id }},
              status: 'completed',
              conclusion: 'success',
              completed_at: new Date().toISOString(),
              output: {
                title: 'Build Android sur VPS',
                summary: 'APK disponible sur le VPS dans `/opt/releases/${{ steps.version.outputs.version }}/`',
              },
            });

      - name: Marquer le check run - echec
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: ${{ steps.check.outputs.check_id }},
              status: 'completed',
              conclusion: 'failure',
              completed_at: new Date().toISOString(),
              output: {
                title: 'Build Android sur VPS',
                summary: 'Echec du build. Voir les logs de la step `Declencher le build sur le VPS`.',
              },
            });
