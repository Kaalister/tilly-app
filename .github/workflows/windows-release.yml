name: Build releases

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.8
          cache: true

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $appVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $line = Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$' | Select-Object -First 1
            $pubspecVersion = $line.Matches[0].Groups[1].Value.Trim()
            $appVersion = $pubspecVersion.Split('+')[0]
          }
          "app_version=$appVersion" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build Windows app
        run: >
          flutter build windows --release
          --dart-define=APP_VERSION=${{ steps.version.outputs.app_version }}

      - name: Create portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive `
            -Path build\windows\x64\runner\Release\* `
            -DestinationPath "dist\Tilly-Windows-${{ steps.version.outputs.app_version }}.zip" `
            -Force
          Copy-Item `
            "dist\Tilly-Windows-${{ steps.version.outputs.app_version }}.zip" `
            "dist\Tilly-Windows-latest.zip" `
            -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\tilly.iss
          Copy-Item `
            "dist\TillySetup-${{ steps.version.outputs.app_version }}.exe" `
            "dist\TillySetup-latest.exe" `
            -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: tilly-windows-${{ steps.version.outputs.app_version }}
          path: |
            dist\*.zip
            dist\*.exe

      - name: Attach Windows artifacts to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist\*.zip
            dist\*.exe

  macos:
    name: macOS release
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.8
          cache: true

      - name: Read app version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            app_version="${GITHUB_REF_NAME#v}"
          else
            pubspec_version="$(grep -E '^version:' pubspec.yaml | head -n 1 | sed -E 's/version:[[:space:]]*//')"
            app_version="${pubspec_version%%+*}"
          fi
          echo "app_version=${app_version}" >> "${GITHUB_OUTPUT}"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build macOS app
        run: >
          flutter build macos --release
          --build-name "${{ steps.version.outputs.app_version }}"
          --dart-define=APP_VERSION=${{ steps.version.outputs.app_version }}

      - name: Package macOS artifacts
        shell: bash
        run: |
          mkdir -p dist/dmg
          ditto \
            -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/Tilly.app \
            "dist/Tilly-macOS-${{ steps.version.outputs.app_version }}.zip"
          cp \
            "dist/Tilly-macOS-${{ steps.version.outputs.app_version }}.zip" \
            "dist/Tilly-macOS-latest.zip"
          cp -R build/macos/Build/Products/Release/Tilly.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create \
            -volname Tilly \
            -srcfolder dist/dmg \
            -ov -format UDZO \
            "dist/Tilly-macOS-${{ steps.version.outputs.app_version }}.dmg"
          cp \
            "dist/Tilly-macOS-${{ steps.version.outputs.app_version }}.dmg" \
            "dist/Tilly-macOS-latest.dmg"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v6
        with:
          name: tilly-macos-${{ steps.version.outputs.app_version }}
          path: |
            dist/*.zip
            dist/*.dmg

      - name: Attach macOS artifacts to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.zip
            dist/*.dmg

  deploy-vps:
    name: Deploy artifacts to VPS
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest

    steps:
      - name: Read app version
        id: version
        shell: bash
        run: |
          app_version="${GITHUB_REF_NAME#v}"
          echo "app_version=${app_version}" >> "${GITHUB_OUTPUT}"

      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: "tilly-*"
          path: dist
          merge-multiple: true

      - name: Create release directory on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          script: mkdir -p /opt/releases/${{ steps.version.outputs.app_version }}

      - name: Upload artifacts to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          source: "dist/Tilly-Windows-${{ steps.version.outputs.app_version }}*,dist/TillySetup-${{ steps.version.outputs.app_version }}*,dist/Tilly-macOS-${{ steps.version.outputs.app_version }}*"
          target: /opt/releases/${{ steps.version.outputs.app_version }}
          strip_components: 1

      - name: Regenerate manifest on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          script: |
            set -e
            RELEASE_DIR="/opt/releases/${{ steps.version.outputs.app_version }}"
            FILES_JSON="$(ls -1 "${RELEASE_DIR}" | grep -v manifest.json | jq -R -s 'split("\n") | map(select(length > 0))')"
            cat > "${RELEASE_DIR}/manifest.json" <<EOF
            {
              "version": "${{ steps.version.outputs.app_version }}",
              "tag": "${{ github.ref_name }}",
              "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "files": ${FILES_JSON}
            }
            EOF
            echo "Manifest mis a jour :"
            cat "${RELEASE_DIR}/manifest.json"
