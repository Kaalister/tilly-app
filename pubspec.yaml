name: tilly
description: Application Flutter de caisse tactique pour les parties airsoft Tilly.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  cloud_firestore: ^6.3.0
  crypto: ^3.0.7
  cryptography: ^2.8.0
  file_picker: ^11.0.2
  firebase_analytics: ^12.4.5
  firebase_auth: ^6.4.0
  firebase_core: ^4.7.0
  firebase_crashlytics: ^5.2.6
  flutter:
    sdk: flutter
  flutter_colorpicker: ^1.1.0
  flutter_dotenv: ^5.2.1
  flutter_secure_storage: ^10.3.0
  http: ^1.2.2
  package_info_plus: ^9.0.1
  path: ^1.9.0
  path_provider: ^2.1.5
  pdf: ^3.12.0
  shared_preferences: ^2.5.6
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.4.0+3
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env.dev
    - assets/branding/tilli-tutorial-transparent.png
    - assets/branding/expressions/
